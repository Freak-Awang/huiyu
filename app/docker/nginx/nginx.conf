worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    limit_req_zone $binary_remote_addr zone=client_update:10m rate=30r/m;

    # Docker containers can receive a new address after recreation. Resolve the
    # backend through Docker DNS instead of keeping the address from Nginx startup.
    upstream im_backend {
        zone im_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        server im-backend:8080 resolve;
    }

    # Gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    # ArtTalk Client
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;

        # ArtTalk Web Client
        location / {
            root   /usr/share/nginx/html/im;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Admin Panel
        location /admin {
            alias /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Backend API
        location ~ ^/api/client/(releases/policy|update-events)$ {
            limit_req zone=client_update burst=20 nodelay;
            proxy_pass http://im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            proxy_pass http://im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for file uploads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            client_max_body_size 128M;
            proxy_request_buffering off;
        }

        # Signed Electron update artifacts. The runner writes the host directory; Nginx mounts it read-only.
        location ~* ^/downloads/arttalk/(stable|beta)/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z.-]+)?/win-x64/(latest|beta)\.yml$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ~* ^/downloads/arttalk/(stable|beta)/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9a-z.-]+)?/win-x64/ArtTalk-Setup-[0-9a-z.-]+-x64\.exe(\.blockmap)?$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Accept-Ranges bytes always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /downloads/arttalk/ {
            return 404;
        }

        # WebSocket
        location /ws {
            proxy_pass http://im_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }
    }
}
