worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Re-resolve the backend after Docker recreates it with a different address.
    upstream im_backend {
        zone im_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        server im-backend:8080 resolve;
    }

    server {
        listen 80;
        server_name localhost;
        add_header X-Content-Type-Options nosniff always;

        location / {
            root /usr/share/nginx/html/im;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /admin {
            alias /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /api {
            proxy_pass http://im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 与后端 spring.servlet.multipart 上限一致，支持上传大体积客户端安装包
            client_max_body_size 512M;
            proxy_request_buffering off;
        }

        location /ws {
            proxy_pass http://im_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
