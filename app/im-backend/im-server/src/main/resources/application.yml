server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/im_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 20260726
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:}

update:
  base-download-url: ${UPDATE_BASE_DOWNLOAD_URL:}
  storage-path: ${UPDATE_STORAGE_PATH:./updates}
  xdelta3-path: ${UPDATE_XDELTA3_PATH:xdelta3}
  rsa-private-key-path: ${UPDATE_RSA_PRIVATE_KEY_PATH:}
  rsa-public-key-path: ${UPDATE_RSA_PUBLIC_KEY_PATH:}
  max-patch-source-versions: ${UPDATE_MAX_PATCH_SOURCE_VERSIONS:3}
  # 单设备检测更新最小间隔秒数（防刷），0 表示不启用
  check-interval-seconds: ${UPDATE_CHECK_INTERVAL_SECONDS:0}

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

file:
  storage: ${FILE_STORAGE:local}
  small-file-max-size: ${FILE_SMALL_FILE_MAX_SIZE:104857600}
  user-quota-bytes: ${FILE_USER_QUOTA_BYTES:10737418240}
  upload-path: ${FILE_UPLOAD_PATH:./upload}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:im-files}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}

p2p:
  file-transfer:
    enabled: ${P2P_FILE_TRANSFER_ENABLED:true}
    max-file-size: ${P2P_MAX_FILE_SIZE:2147483648}
    max-folder-size: ${P2P_MAX_FOLDER_SIZE:21474836480}
    max-folder-files: ${P2P_MAX_FOLDER_FILES:10000}
    max-signal-bytes: ${P2P_MAX_SIGNAL_BYTES:65536}
