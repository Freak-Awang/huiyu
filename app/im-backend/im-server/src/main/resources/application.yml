server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/im_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 20260726
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:}

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

file:
  storage: ${FILE_STORAGE:local}
  max-size: ${FILE_MAX_SIZE:2147483648}
  small-file-max-size: ${FILE_SMALL_FILE_MAX_SIZE:104857600}
  user-quota-bytes: ${FILE_USER_QUOTA_BYTES:10737418240}
  chunk-size: ${FILE_CHUNK_SIZE:67108864}
  retention-days: ${FILE_RETENTION_DAYS:7}
  upload-retention-hours: ${FILE_UPLOAD_RETENTION_HOURS:24}
  upload-path: ${FILE_UPLOAD_PATH:./upload}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:im-files}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
