name: Desktop release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to rebuild (for example v0.0.9)
        required: true
        type: string

jobs:
  build-sign-package:
    runs-on: [self-hosted, Windows, X64]
    environment: desktop-signing
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
        working-directory: app/im-web
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/im-web/package-lock.json

      - name: Validate immutable release baseline
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(?:\.[0-9A-Za-z-]+)*)?)$') {
            throw 'Release tag must be v<semver>'
          }
          $version = $Matches.version
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $lockVersion = (Get-Content -LiteralPath package-lock.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version -or $lockVersion -ne $version) {
            throw "Tag, package.json and package-lock.json versions must match ($version)"
          }
          git fetch origin main --tags --force
          if ((git rev-parse HEAD).Trim() -ne (git rev-list -n 1 $tag).Trim()) {
            throw 'Checked out commit does not match the release tag'
          }
          if ((git rev-parse HEAD).Trim() -ne (git rev-parse origin/main).Trim()) {
            throw 'Release tag must point at origin/main'
          }
          if (git status --porcelain) { throw 'Release worktree must be clean' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_COMMIT=$((git rev-parse HEAD).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: npm ci
      - run: npm run verify

      - name: Build and sign NSIS package
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build:desktop

      - name: Verify signed installer and application
        env:
          EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_SIGNER_THUMBPRINT }}
          EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          $installer = Get-Item -LiteralPath "release\ArtTalk-Setup-$env:RELEASE_VERSION-x64.exe"
          $application = Get-Item -LiteralPath 'release\win-unpacked\ArtTalk.exe'
          foreach ($file in @($installer, $application)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $($file.Name): $($signature.Status)" }
            if (-not $signature.TimeStamperCertificate) { throw "Missing trusted timestamp for $($file.Name)" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT) { throw "Unexpected signer certificate for $($file.Name)" }
            if ($signature.SignerCertificate.Subject -notlike "*$env:EXPECTED_PUBLISHER*") { throw "Unexpected publisher for $($file.Name)" }
          }
          $provenance = [ordered]@{
            version = $env:RELEASE_VERSION
            sourceCommit = $env:SOURCE_COMMIT
            installer = $installer.Name
            installerSize = $installer.Length
            installerSha512 = $null
            signerThumbprint = $env:EXPECTED_SIGNER_THUMBPRINT
            verifiedAt = [DateTimeOffset]::UtcNow.ToString('o')
          }
          $sha512 = [Security.Cryptography.SHA512]::Create()
          try { $provenance.installerSha512 = [Convert]::ToBase64String($sha512.ComputeHash([IO.File]::ReadAllBytes($installer.FullName))) }
          finally { $sha512.Dispose() }
          $provenance | ConvertTo-Json | Set-Content -LiteralPath 'release\release-provenance.json' -Encoding utf8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arttalk-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            app/im-web/release/*.exe
            app/im-web/release/release-provenance.json
          if-no-files-found: error
